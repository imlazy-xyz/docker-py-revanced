services:
  revanced:
    image: nikhilbadyal/docker-py-revanced
    container_name: revanced-builder
    pull_policy: always
    env_file:
      - .env
    volumes:
      - .:/app:z
      # The prebuilt image bakes in its own /entrypoint; mount ours so repo changes (e.g. the cloakbrowser pin) apply.
      - ./entrypoint:/entrypoint:z
